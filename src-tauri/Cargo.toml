[package]
name = "fluentdesk-core"
version = "0.1.0"
edition = "2021"
description = "FluentDesk AI — Local-first, voice-first English speaking tutor core and Tauri backend"
license = "MIT"

[lib]
name = "fluentdesk_core"
path = "src/lib.rs"

[[bin]]
name = "fluentdesk-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.83"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2.0.3"
tokio = { version = "1.42.0", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
